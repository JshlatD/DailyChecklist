
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6fc">

    <title>Daily Checklist</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">

    <!-- CALENDAR SCREEN -->
    <div id="calendarScreen">

        <header class="app-header">
            <h1>Daily Checklist</h1>
            <p>Your little space for daily progress.</p>
        </header>

        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span>🔥 Current Streak</span>
                <h2 id="streak">0 Days</h2>
            </div>

            <div class="stat-card">
                <span>Today's Progress</span>
                <h2 id="progress">0%</h2>
            </div>

        </section>

        <!-- Calendar -->
        <section class="calendar-card">

            <div class="calendar-header">

                <button id="prevMonth" aria-label="Previous month">
                    ❮
                </button>

                <h2 id="monthYear"></h2>

                <button id="nextMonth" aria-label="Next month">
                    ❯
                </button>

            </div>

            <div class="calendar-grid" id="calendar"></div>

            <div class="calendar-legend">
                <span>
                    <i class="legend-dot green"></i>
                    Completed
                </span>

                <span>
                    <i class="legend-dot blue"></i>
                    Selected
                </span>
            </div>

        </section>

    </div>


    <!-- CHECKLIST SCREEN -->
    <div id="taskScreen" class="hidden">

        <section class="task-card">

            <!-- Selected Date -->
            <div class="task-heading">

                <h2 id="selectedDate"></h2>

                <p id="taskMessage">
                    Your checklist for this day.
                </p>

            </div>

            <!-- Progress Bar -->
            <div class="progress-track">
                <div id="progressBar"></div>
            </div>

            <!-- Add Task -->
            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                    maxlength="100"
                    autocomplete="off"
                    required
                >

                <button type="submit" id="addTaskBtn">
                    +
                </button>

            </form>

            <!-- Task List -->
            <div id="taskList"></div>

            <!-- Task Footer -->
            <div class="task-footer">

                <span id="taskCount">0 tasks</span>

                <button id="clearCompleted" type="button">
                    Clear completed
                </button>

            </div>

        </section>

        <!-- BACK TO CALENDAR BUTTON -->
        <button id="backButton" class="back-button">
            ← Back to Calendar
        </button>

    </div>


    <!-- Footer -->
    <footer>
        <p>One day at a time. Keep going! ✨</p>
    </footer>

</div>


<!-- JavaScript -->
<script src="./script.js"></script>

</body>
</html>
